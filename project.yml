# XcodeGen 工程描述文件：云端 CI 用 `xcodegen generate` 生成 .xcodeproj
name: LoopPlayer
options:
  bundleIdPrefix: local.ios
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

targets:
  LoopPlayer:
    type: application
    platform: iOS
    sources:
      - path: LoopPlayer
        excludes:
          - "Info.plist"
    info:
      path: LoopPlayer/Info.plist
      properties:
        CFBundleDisplayName: loopplayer
        CFBundleName: LoopPlayer
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "104"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        NSPhotoLibraryUsageDescription: 需要访问相册以播放视频
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ios.loopplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        # TrollStore 安装免签名：构建产物不做任何代码签名
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

schemes:
  LoopPlayer:
    build:
      targets:
        LoopPlayer: all
